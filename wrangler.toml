name = "demand-management-platform"
main = "worker/index.ts"
compatibility_date = "2026-08-20"
workers_dev = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/openapi/*"]

[vars]
APP_ENV = "production"
OPENROUTER_MODEL = "openai/gpt-4o-mini"

[[d1_databases]]
binding = "DB"
database_name = "demand-management-platform-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "demand-management-platform-files"
preview_bucket_name = "demand-management-platform-files-preview"

[observability]
enabled = true
