name = "demand-management-platform"
main = "worker/index.ts"
compatibility_date = "2026-08-20"
workers_dev = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/openapi/*"]

[vars]
APP_ENV = "production"
OPENROUTER_MODEL = "openai/gpt-4o-mini"

[[d1_databases]]
binding = "DB"
database_name = "demand-management-platform-db"
database_id = "b97434dd-7dc0-4517-ab51-b5456c7451b0"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "FILES"
id = "c8c83356574b435291e756d1d27f0423"

[observability]
enabled = true
